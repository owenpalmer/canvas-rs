[package]
name = "canvas-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
canvas-mcp = { version = "0.3.0", path = "../canvas-mcp" }
chrono = "0.4.45"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
env_logger = "0.11.11"
futures = "0.3.34"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
log = "0.4.34"
md-5 = "0.11.0"
once_cell = "1.21.4"
pdfium-render = "0.9.4"
percent-encoding = "2.3.2"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
resvg = "0.48.1"
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
tiny-skia = "0.12.0"
tokio = { version = "1.53.1", features = ["full"] }
ttf-parser = "0.25.1"
unicode-segmentation = "1.13.3"
url = "2.5.8"
