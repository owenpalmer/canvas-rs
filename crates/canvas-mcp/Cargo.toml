[package]
name = "canvas-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
dirs = "7.0.0"
env_logger = "0.11.11"
futures = "0.3.34"
hex = "0.4.3"
htmd = "0.5.5"
keyring = { version = "3", features = ["async-secret-service", "tokio", "crypto-rust", "windows-native"] }
libc = "0.2"
log = "0.4.34"
lz4_flex = "0.14.0"
once_cell = "1.21.4"
percent-encoding = "2.3.2"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "multipart", "http2", "cookies", "form", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha1 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
url = "2.5.8"
zip = "8.6.0"

[lib]
name = "canvas_mcp"
path = "src/lib.rs"

[[bin]]
name = "canvas-mcp"
path = "src/bin/canvas-mcp.rs"

[[bin]]
name = "canvas-check"
path = "src/bin/canvas-check.rs"
