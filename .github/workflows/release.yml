name: Release

# Push a tag like v0.2.0 to build and publish a release. Or run it by hand (Actions → Release →
# Run workflow): with a tag, the builds are added to that release (replacing ones of the same
# name); without one, they're only kept as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release to add the builds to (e.g. v0.2.0); empty for artifacts only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --workspace

      - name: Package
        shell: bash
        run: |
          scripts/fetch-pdfium.sh win-x64
          out=dist/canvas-rs
          mkdir -p "$out/licenses"
          cp target/release/canvas-app.exe target/release/canvas-mcp.exe target/release/canvas-check.exe "$out/"
          cp vendor/pdfium/win-x64/bin/pdfium.dll "$out/"
          cp README.md "$out/"
          cp vendor/pdfium/win-x64/LICENSE "$out/licenses/PDFium-LICENSE.txt"
          cp assets/fonts/Inter-LICENSE.txt "$out/licenses/"
          cp assets/fonts/katex/LICENSE "$out/licenses/KaTeX-LICENSE.txt"
          cd dist && 7z a -tzip ../canvas-rs-windows-x64.zip canvas-rs

      # The packaged MCP server answers every tool against sample data.
      - name: Smoke test
        shell: bash
        env:
          CANVAS_DEMO: "1"
        run: |
          export CANVAS_MCP_DIR="$RUNNER_TEMP/canvas-smoke"
          dist/canvas-rs/canvas-mcp.exe --version
          dist/canvas-rs/canvas-mcp.exe smoke

      - uses: actions/upload-artifact@v4
        with:
          name: canvas-rs-windows-x64
          path: canvas-rs-windows-x64.zip

  linux:
    # the oldest supported image, so the build runs on older distributions' glibc too
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # a stalled package mirror once hung this for the job's whole 6 hours
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y libxkbcommon-dev libwayland-dev
        timeout-minutes: 10
      - run: cargo build --release --locked --workspace
      - run: scripts/package-linux.sh

      - name: Smoke test
        env:
          CANVAS_DEMO: "1"
        run: |
          export CANVAS_MCP_DIR="$RUNNER_TEMP/canvas-smoke"
          dist/canvas-rs/canvas-mcp --version
          dist/canvas-rs/canvas-mcp smoke

      - uses: actions/upload-artifact@v4
        with:
          name: canvas-rs-linux-x64
          path: dist/canvas-rs-linux-x64.tar.gz

  publish:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" canvas-rs-windows-x64.zip canvas-rs-linux-x64.tar.gz --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" canvas-rs-windows-x64.zip canvas-rs-linux-x64.tar.gz -R "$GITHUB_REPOSITORY" \
              --title "canvas-rs $TAG" \
              --notes "Windows: unzip anywhere and run canvas-app.exe (it may warn that the app isn't code-signed: More info → Run anyway). Linux: unpack and run ./install.sh, which adds Canvas to your app launcher and canvas-app / canvas-mcp to ~/.local/bin. canvas-app --demo shows sample data."
          fi
